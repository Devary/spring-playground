spring.application.name=demo
spring.datasource.db-kind=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=demo
spring.datasource.password=demo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings for demo
# Secret must be at least 256 bits for HS256
# (Use environment-specific secrets in production)
demo.security.jwt.secret=ThisIsA256BitSecretKeyForJwtGenerationInDemoProject123
demo.security.jwt.issuer=demo-app
demo.security.jwt.expiration-seconds=3600
