---
spring:
  config:
    activate:
      on-profile: yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    db-kind: postgresql
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

demo:
  security:
    api-token: ChangeThisYamlToken456
server:
  port: 6666