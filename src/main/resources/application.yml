---
spring:
  config:
    activate:
      on-profile: yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_yaml
    username: demo
    password: demo
    driver-class-name: org.postgresql.Driver
    db-kind: postgresql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

demo:
  security:
    jwt:
      secret: ThisIsAnotherSecureJwtSecretKeyValueForYamlProfile456
      issuer: demo-app-yaml
      expiration-seconds: 7200
