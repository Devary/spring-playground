---
spring:
  config:
    activate:
      on-profile: yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/demo_yaml
    username: demo
    password: demo
    driver-class-name: org.postgresql.Driver
    db-kind: postgresql
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

demo:
  security:
    api-token: ChangeThisYamlToken456
